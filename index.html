<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Games Catalog</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="header">
        <div class="container">

            <h1>🎲 Каталог настольных игр</h1>

            <p class="subtitle">
                Лучшие настольные игры мира
            </p>

            <div class="controls">

                <input
                    type="text"
                    id="search"
                    placeholder="Поиск игры...">

                <select id="genreFilter">

                    <option value="all">
                        Все жанры
                    </option>

                    <option value="Стратегия">
                        Стратегия
                    </option>

                    <option value="Семейная">
                        Семейная
                    </option>

                    <option value="Кооперативная">
                        Кооперативная
                    </option>

                    <option value="Карточная">
                        Карточная
                    </option>

                    <option value="Экономическая">
                        Экономическая
                    </option>

                </select>

            </div>

        </div>
    </header>

    <main>

        <div class="container">

            <div id="gamesContainer" class="games-grid">

            </div>

        </div>

    </main>

    <footer>

        <p>
            © 2026 Каталог настольных игр
        </p>

    </footer>

    <script src="js/games.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
