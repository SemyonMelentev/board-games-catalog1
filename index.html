<!DOCTYPE html>

<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Games Catalog</title>

```
<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
```

</head>

<body>

```
<header class="header">

    <div class="container">

        <h1>🎲 Каталог настольных игр</h1>

        <p class="subtitle">
            Лучшие настольные игры мира
        </p>

        <div class="controls">

            <input
                type="text"
                id="search"
                placeholder="Поиск игры...">

            <select id="genreFilter">

                <option value="all">
                    Все жанры
                </option>

                <option value="Стратегия">
                    Стратегия
                </option>

                <option value="Семейная">
                    Семейная
                </option>

                <option value="Кооперативная">
                    Кооперативная
                </option>

                <option value="Карточная">
                    Карточная
                </option>

                <option value="Экономическая">
                    Экономическая
                </option>

            </select>

            <button
                id="addGameBtn"
                class="details-btn">

                ➕ Добавить игру

            </button>

        </div>

    </div>

</header>

<main>

    <div class="container">

        <div
            id="gamesContainer"
            class="games-grid">
        </div>

        <div
            id="gameFormContainer"
            style="display:none; margin-top:40px;">

            <h2>Добавить игру</h2>

            <input
                id="newTitle"
                placeholder="Название игры">

            <br><br>

            <input
                id="newGenre"
                placeholder="Жанр">

            <br><br>

            <input
                id="newPlayers"
                placeholder="Количество игроков">

            <br><br>

            <input
                id="newRating"
                type="number"
                step="0.1"
                placeholder="Рейтинг">

            <br><br>

            <input
                id="newImage"
                placeholder="Ссылка на изображение">

            <br><br>

            <textarea
                id="newDescription"
                rows="5"
                placeholder="Описание игры"></textarea>

            <br><br>

            <button
                id="saveGameBtn"
                class="details-btn">

                Сохранить игру

            </button>

        </div>

    </div>

</main>

<footer>

    <p>
         2026 Каталог настольных игр
    </p>

</footer>

<script src="js/games.js"></script>
<script src="js/app.js"></script>
```

</body>

</html>
